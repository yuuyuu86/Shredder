name: Shredder
options:
  bundleIdPrefix: app.shredder
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  ShredderCore:
    path: Packages/ShredderCore
targets:
  Shredder:
    type: application
    platform: macOS
    sources:
      - path: Shredder
        excludes:
          - Info.plist
    dependencies:
      - package: ShredderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shredder.Shredder
        PRODUCT_NAME: Shredder
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Shredder/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Shredder
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: デスクトップのファイルを整理するために使用します。
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: 書類フォルダのファイルを整理するために使用します。
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: ダウンロードフォルダのファイルを整理するために使用します。
        # 直接配布: App Sandbox は使わず、Hardened Runtime + 公証で配布する。
        CODE_SIGN_ENTITLEMENTS: Shredder/Shredder.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
